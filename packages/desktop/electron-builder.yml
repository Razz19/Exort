appId: ai.exort.desktop
productName: Exort
asar: true
# The sidecar loads the v2 plugin and shared compile tool source from real files.
asarUnpack:
  - out/main/opencode-config/**/*
npmRebuild: false
# install-app-deps can run npm install in a hoisted workspace. Keep the locked
# build tools installed instead of pruning them with --production.
npmArgs:
  - --include=dev
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/**/*
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: Razz19
  repo: Exort
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - dmg
    - zip
dmg:
  sign: true
win:
  icon: resources/icon.ico
  target:
    - nsis
linux:
  category: Development
  executableName: exort
  icon: resources/exort_logo.png
  target:
    - AppImage
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
